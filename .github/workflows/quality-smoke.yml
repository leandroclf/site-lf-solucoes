name: Quality Smoke

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structure
        run: python3 scripts/validate_site_structure.py

      - name: Build Cloudflare Pages public artifact
        run: |
          python3 scripts/verify_public_catalog.py --local
          python3 scripts/build_cloudflare_pages.py
          test -f dist/index.html
          test -f dist/produtos/index.html
          test ! -e dist/data
          test ! -e dist/.github
          test ! -e dist/serverless

      - name: Quality smoke (SEO/A11y basic)
        run: python3 scripts/quality_smoke.py

      - name: Security smoke (DOM sinks and serverless inputs)
        run: python3 scripts/security_smoke.py

      - name: Budget check
        run: |
          python3 -m unittest discover -s scripts -p test_budget_check.py
          python3 scripts/budget_check.py
